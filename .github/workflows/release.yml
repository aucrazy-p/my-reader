name: Build Desktop Releases

# 手动运行：Actions → Build Desktop Releases → Run workflow，release_tag 留空即可。
# 每次构建先拉取 hadc188/reader 当时最新的 main 并合并，再校验自定义功能，
# 产物 = 最新上游 + 本仓库的无边框改动。fork 仓库不带上游的 Releases，
# release_tag 留空时自动取上游 Cargo.toml 里的项目版本号。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release 标签；留空则自动取上游项目版本'
        required: false
        type: string
        default: ''

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      upstream_sha: ${{ steps.upstream.outputs.sha }}
    steps:
      - name: Resolve latest upstream
        id: upstream
        shell: bash
        env:
          UPSTREAM_URL: https://github.com/hadc188/reader.git
          UPSTREAM_RAW: https://raw.githubusercontent.com/hadc188/reader
        run: |
          # 锁定本次构建使用的上游提交：三个平台共用同一个 sha，避免构建期间
          # 上游又推了新提交，导致各平台产物来自不同代码。
          sha="$(git ls-remote "$UPSTREAM_URL" refs/heads/main | cut -f1)"
          if [[ -z "$sha" ]]; then
            echo "::error::无法解析上游 main 的提交"
            exit 1
          fi
          version="$(curl -fsSL "$UPSTREAM_RAW/$sha/Cargo.toml" | grep -m1 '^version' | cut -d '"' -f2)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::无法从上游 Cargo.toml 读取有效的项目版本号"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=v$version" >> "$GITHUB_OUTPUT"
          echo "Upstream: $sha (v$version)"

      - name: Resolve Release target
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag || '' }}
          UPSTREAM_TAG: ${{ steps.upstream.outputs.version }}
        run: |
          # 手动 dispatch 优先用输入标签；留空则用本次锁定的上游版本号。
          # fork 仓库通常没有已发布的 Release，原逻辑会直接卡在
          # "No published Release found" 而整个构建不启动。
          if [[ -n "$RELEASE_TAG_INPUT" ]]; then
            release_tag="$RELEASE_TAG_INPUT"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            release_tag="$GITHUB_REF_NAME"
          elif [[ -n "$UPSTREAM_TAG" ]]; then
            release_tag="$UPSTREAM_TAG"
          elif ! release_tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName' 2>/dev/null)"; then
            echo "No published Release found" >&2
            exit 1
          fi

          if ! gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$release_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "Reader $release_tag" \
              --generate-notes
          fi

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "Release target: $release_tag"

  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x64
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            bundles: nsis
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          - os: macos-latest
            platform: macos
            arch: universal
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge latest upstream
        shell: bash
        env:
          UPSTREAM_URL: https://github.com/hadc188/reader.git
          UPSTREAM_SHA: ${{ needs.prepare-release.outputs.upstream_sha }}
        run: |
          # 只合并到 runner 工作区，绝不 push 回仓库：origin/main 始终保留
          # 我们的自定义提交，workflow 自身也不会被上游版本覆盖。
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM_URL"
          git fetch --no-tags upstream main
          if ! git merge --no-edit "$UPSTREAM_SHA"; then
            echo "::error::合并上游失败，需人工解冲突后推送到 main 再重新构建"
            git diff --name-only --diff-filter=U || true
            exit 1
          fi
          echo "Merged upstream: $UPSTREAM_SHA"

      - name: Verify custom borderless features
        run: node scripts/verify-borderless.mjs

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Verify release metadata
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.release_tag }}
        run: node scripts/check-release-metadata.mjs

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Test frontend
        working-directory: frontend
        run: npm test -- --run

      - name: Test Rust core
        run: cargo test --lib -j 4

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Tauri bundle
        working-directory: desktop
        env:
          CARGO_BUILD_JOBS: 4
        run: npx tauri build --ci --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}" -- --locked

      - name: Collect release artifacts
        env:
          TAURI_TARGET: ${{ matrix.target }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.release_tag }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: node scripts/collect-desktop-artifacts.mjs

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Reader-${{ needs.prepare-release.outputs.release_tag }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error

      - name: Upload platform files to Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.prepare-release.outputs.release_tag }}" release/* --clobber

  publish-release:
    name: Publish GitHub Release
    needs:
      - prepare-release
      - build
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Publish completed Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          # 先结束草稿状态，再单独设置 latest，避免 GitHub API 在同一请求中
          # 先校验 latest 而把仍处于 draft 状态的 Release 判定为无效。
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --latest
